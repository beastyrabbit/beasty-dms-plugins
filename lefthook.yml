pre-commit:
  commands:
    plugin-integrity:
      run: python3 scripts/plugin_doctor.py --repo-only
      fail_text: "Local DMS plugin inventory is incomplete or untracked"

    gitleaks:
      run: gitleaks protect --staged --no-banner
      fail_text: "Secrets detected in staged changes"

    qml-lint:
      glob: "*.qml"
      run: |
        for f in {staged_files}; do
          if [ -f "$f" ]; then
            qmlformat "$f" > /dev/null || exit 1
            qmllint -I /usr/share/quickshell/dms "$f" || exit 1
          fi
        done
        QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/tst_quick_ai_launcher.qml
      fail_text: "QML syntax issues found"

    plugin-json:
      glob: "**/plugin.json"
      run: python3 scripts/validate_plugin.py {staged_files}
      fail_text: "Plugin manifest validation failed"

    python-quality:
      glob: "*.py"
      run: |
        ruff check QuickAI scripts tests
        ruff format --check QuickAI scripts tests
        python3 -m unittest discover -s tests -v
      fail_text: "Quick AI tests failed"

pre-push:
  commands:
    plugin-integrity:
      run: python3 scripts/plugin_doctor.py --head
      fail_text: "Committed DMS plugin inventory is incomplete"
